<body>
<h1>Rectangle Calculator</h1>
    <label for="height">Height:</label>
    <input type="number" id="height" name="height" placeholder="20"><br><br>
    <label for="width">Width:</label>
    <input type="number" id="width" name="width" value="12" required><br><br>
    <button onclick="calc()">Calculate Area and Perimeter</button>


   <h2>Area of Rectangle</h2> 
   <p id="area"></p>
   <h2>Perimeter of Rectangle</h2>
   <p id="perimeter"></p>
   <h2>Inertia Y of Rectangle</h2>
   <p id="inertiaY"></p>
   <h2>Inertia X of Rectangle</h2>
   <p id="inertiaX"></p>
</body>
