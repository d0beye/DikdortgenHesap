<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="hesaplar.js" defer></script>
</head>             
<body>
<h1>Rectangle Calculator</h1>
    <label for="height">Height:</label>
    <input type="number" id="height" name="height" placeholder="20"> mm <br><br>
    <label for="width">Width:</label>
    <input type="number" id="width" name="width" value="12" required> mm <br><br>
    <button onclick="calc()">Calculate Area and Perimeter</button>
   <table>
    <tr>
        <th>Property</th>
        <th>Value</th>
        <th>Unit</th>
    </tr>
    <tr>
        <td>Area (mm²)</td>
        <td id="area"></td>
        <td>mm²</td>
    </tr>
    <tr>
        <td>Perimeter (mm)</td>
        <td id="perimeter"></td>
        <td>mm</td>
    </tr>
    <tr>
        <td>Inertia Y (mm<sup>4</sup>)</td>
        <td id="inertiaY"></td>
        <td>mm<sup>4</sup></td>
    </tr>
    <tr>
        <td>Inertia X (mm<sup>4</sup>)</td>
        <td id="inertiaX"></td>
        <td>mm<sup>4</sup></td>
    </tr>
   </table>
</body>
</html>
