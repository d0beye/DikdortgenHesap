<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="hesaplar.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        table {
            width: 50%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #888787;
        }
    </style>
</head>             
<body>
<h1>Rectangle Calculator</h1>
    <label for="height">Height:</label>
    <input type="number" id="height" name="height" placeholder="20"> mm <br><br>
    <label for="width">Width:</label>
    <input type="number" id="width" name="width" value="12" required> mm <br><br>
    <button onclick="calc()">Calculate Area and Perimeter</button>

    <table>
    <tr>
        <th>Property</th>
        <th>Value</th>
        <th>Unit</th>
    </tr>
    <tr>
        <td>Area</td>
        <td id="area"></td>
        <td>mm²</td>
    </tr>
    <tr>
        <td>Perimeter</td>
        <td id="perimeter"></td>
        <td>mm</td>
    </tr>
    <tr>
        <td>Inertia Y</td>
        <td id="inertiaY"></td>
        <td>mm<sup>4</sup></td>
    </tr>
    <tr>
        <td>Inertia X</td>
        <td id="inertiaX"></td>
        <td>mm<sup>4</sup></td>
    </tr>
   </table>
</body>
</html>
