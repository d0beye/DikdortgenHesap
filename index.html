    <label for="height">Height:</label>
    <input oninput="calc()" type="number" id="height" name="height" value="20"> mm

    <input oninput="calc()" type="number" id="width" name="width" value="12" required> mm <br><br>

    <tr>

    // Create a QR Code instance with some basic options.
